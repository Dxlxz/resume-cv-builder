<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rizzume - ATS-ready resumes and CVs with live PDF preview, Malaysia corporate presets, and local-first privacy. No account required." />
    <!-- Phone browser bars follow the page: the off-white light background and the ink dark one (F-009). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f121a" />
    <script>
      // Apply the stored theme before first paint so there is no light flash in dark mode.
      try {
        var stored = localStorage.getItem('rizzume:theme');
        var dark = stored === 'dark' || ((stored === null || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>Rizzume — ATS-ready resumes, built locally</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
